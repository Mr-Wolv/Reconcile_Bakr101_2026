name: security

# The scans that cannot gate a pull request, plus the one that can.
#
# WHY THIS FILE EXISTS SEPARATELY FROM dependency-scan.yml
# -------------------------------------------------------
# `dependency-scan.yml` runs OWASP dependency-check against the NVD. That is the right tool and it
# is slow: a cold NVD download is tens of minutes and any network hiccup fails the run. It stays
# scheduled and manual.
#
# This file runs the three checks that are fast enough to be worth trusting, and that therefore
# have something to prove by existing:
#
#   osv   - queries OSV for the exact artifacts Maven resolves. Public API, no key, seconds.
#           This is the check that can run on every push, so it is the one that gates.
#   deps  - GitHub's own dependency review, on pull requests. A *different* database from OSV
#           (the GitHub Advisory Database), which is the point: it is not the same evidence
#           twice, and unlike OWASP dependency-check it needs no NVD access and no API key.
#   sast  - Semgrep over the source. Gating at ERROR severity only: a rule that fires on every
#           commit is a rule that gets switched off, and a disabled check reports nothing.
#   score - OSSF Scorecard, the supply-chain posture checks (branch protection, pinned actions,
#           signed releases, dangerous workflows). Non-gating: it reports on the repository rather
#           than on the code, so it starts red on any new repository and is a to-do list, not a
#           build failure.
#   zap   - an OWASP ZAP baseline scan against the running image. Non-gating on what it *finds*,
#           because a baseline scan reports alerts nobody has triaged yet and a red build nobody
#           can act on is theatre. What it does not tolerate is producing no evidence: it fails
#           only when the scan leaves no report behind, which covers both "the scanner errored"
#           and "the report could not be written". It uploads its report either way. (This said
#           "Scheduled only", which was never true of the job - it has no event guard and runs on
#           every trigger.)
#
# WHAT REPLACED WHAT
# ------------------
# OWASP dependency-check against the NVD is deliberately *not* here, and `dependency-scan.yml`
# keeps it for when an NVD API key exists. It cannot run without one: a cold sync of NVD API 2.0
# is roughly 250k requests, which is about seventeen days on the anonymous endpoint's five-per-
# thirty-seconds. `osv` and `deps` together cover the same ground with two independent databases,
# in seconds, with no secret to manage. That is a real substitution and not the same claim as
# "we run dependency-check" - see docs/roadmap.md for the difference.
#
# WHAT IT DOES NOT DO
# -------------------
# It does not claim the application is secure. Every job here has now executed on a hosted runner,
# and green is a measurement rather than an assurance: Semgrep reports 0 ERROR-severity findings
# under one pinned ruleset, ZAP reports one untriaged warning against an unauthenticated scan, and
# Scorecard reports on the repository. The first execution found two things no offline check could
# - the Semgrep ruleset below is retired upstream, and the ZAP job could not write its report into
# a directory owned by the runner - and CI_EXECUTION_REPORT.md records both. What remains true of
# this file is narrower and worth stating: `score` and `zap` are advisory by decision, so a red job
# there is a to-do list rather than a blocked release, and the gates below are set conservatively
# so that an execution tells a reader something useful rather than failing on an untriaged alert.
#
# Actions are pinned to commit SHAs, and scripts/pin_actions.py --check enforces it (D-01: this
# comment previously said they were "referenced by tag", which had stopped being true). A tag can
# be moved after the fact; a SHA cannot, so the SHA is the correct unit for a security gate. The
# `# v4`-style comment beside each reference is there so a reviewer can read the intent without a
# network round trip.

on:
  schedule:
    # 04:23 UTC on Monday and Thursday. Off-round minutes, deliberately - every repository that
    # uses `0 4 * * *` is queued for the same instant and the shared runner pool is the
    # bottleneck exactly then.
    - cron: "23 4 * * 1,4"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `dependency:tree` writes exactly the coordinates OSV is asked about. Scanning
      # pom.xml instead would query declared versions and miss every transitive dependency,
      # which is where CVEs actually live.
      - name: Resolve the dependency graph
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Write the resolved dependency graph
        run: mvn -B -ntp dependency:tree -DoutputFile=target/deptree.txt -DappendOutput=false

      # Exits non-zero only on an advisory that is not in docs/security/osv-baseline.json, which
      # holds the seven already triaged in docs/security/dependency-findings.md. A gate that
      # reports the same seven forever is a gate nobody reads.
      - name: Query OSV
        run: python3 scripts/osv_check.py

      # F-11. The Dependency-Check summary is a checked-in script with its own fixture tests,
      # because the version this replaces was an inline heredoc reading a JSON path that
      # Dependency-Check does not emit — so it reported "0 vulnerable dependencies" on a report
      # full of them, and no test could catch it, because a parser exercised only by a scheduled
      # job cannot be exercised at all.
      - name: Test the dependency-report parser against known findings
        run: python3 scripts/test_dependency_check_summary.py

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: osv-report
          path: target/deptree.txt
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  deps:
    # The reason is in the display name on purpose: the job is skipped on every push, and a
    # greyed-out row with no explanation reads as something that failed to start.
    name: GitHub Advisory dependency review (pull requests only)
    # Pull requests only. The action answers "what did this pull request *add*", which is
    # meaningless without a base to compare against - it has no answer on a push, and none on
    # the first commit of a repository.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Dependency review is a GitHub feature, not a self-contained action: it needs the
      # repository's dependency graph to be enabled, and no workflow can enable it. Where it is not
      # enabled, the action fails in five seconds with "Dependency review is not supported on this
      # repository" - a red job whose cause is a settings page, not anything in the pull request,
      # and one that has been red on every pull request this repository has ever had.
      #
      # Probing the endpoint the action itself needs turns that into a stated skip. If it answers,
      # the review below runs for real and fails on a high advisory as before; if it does not, the
      # reason and the one-line fix are printed instead of an unexplained red. The probe is honest
      # about what it is: while the feature is off, this job examines nothing, and the OSV scan in
      # the same workflow is the coverage that is actually running.
      - name: Check whether dependency review is available here
        id: dependency-review
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if [ "$status" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "dependency review is available (HTTP $status)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency review is unavailable for this repository (HTTP" \
                 "$status): its dependency graph is not enabled and no workflow can enable it."
            echo "::warning::Enable it at https://github.com/${{ github.repository }}/settings/security_analysis" \
                 "and this job starts reviewing dependencies again. Until then it examines nothing."
          fi

      # `fail-on-severity: high` rather than the default. A moderate advisory added to a
      # simulated payment engine is a decision to record, not a build to block; a high or
      # critical one is not.
      - name: Review the dependencies this pull request adds
        if: steps.dependency-review.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  score:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-gating. Scorecard measures the repository, not the code: a repository with one commit
    # and no branch protection scores badly by construction, and gating on that would mean a red
    # build that a code change cannot possibly fix. It produces the to-do list instead.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Deliberately NOT published. Publishing asks for `id-token: write` and
          # `security-events: write`, which are the most powerful permissions this repository
          # would ever hold, and it is not worth granting them for a check nobody is reading in
          # the Security tab yet. The SARIF is uploaded as an artifact instead; turning
          # publishing on is a one-line change once someone actually watches that tab.
          publish_results: false

      - name: Show the checks that failed
        if: always()
        run: |
          test -f scorecard.sarif || { echo "::warning::no Scorecard results"; exit 0; }
          python3 - <<'PY'
          import json, sys
          with open("scorecard.sarif") as fh:
              sarif = json.load(fh)
          for run in sarif.get("runs", []):
              tool = run.get("tool", {}).get("driver", {}).get("name", "scorecard")
              for result in run.get("results", []):
                  score = result.get("properties", {}).get("score")
                  print(f"  {tool} {result.get('check_id')}: {score}")
          PY

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  sast:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Semgrep is run as a CLI rather than through `returntocorp/semgrep-action`. That action is a
      # Docker action declaring four inputs — config, icon, colour, publishToken — and it declares
      # neither `sarif` nor `output` nor `generateSarif`. Passing them is not an error; GitHub sets
      # INPUT_* variables and the action ignores the ones it does not declare, so the SARIF this job
      # then asserts on would never have been written and the gate below would fail on every run for
      # a reason that looks like "Semgrep found something" and is not. The successor action could
      # not be verified from here, so the CLI is used directly: one fewer third-party action to
      # trust, and every flag is visible in this file.
      #
      # `p/java` rather than `--config auto`. The automatic ruleset is the largest and slowest and
      # changes under you; a pinned ruleset makes a red build reproducible, which is the only
      # property that makes a gate worth having.
      #
      # This was `p/spring`, and that is the whole reason the job failed on its first hosted run.
      # Semgrep retired the language-specific Spring rulesets upstream: `p/spring`, `p/java-spring`
      # and `p/springboot` now all answer HTTP 404. A 404 is not an error Semgrep raises loudly —
      # it writes the problem into `toolExecutionNotifications`, loads **zero rules**, emits a SARIF
      # with an empty `results` array, and exits 7. The gate below, had it been reached, would have
      # read those zero results and declared the codebase clean. See the non-vacuity check for why
      # that is now impossible.
      - name: Run Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          # No `--error` here: the gate is the SARIF parse in the next step, so that what fails the
          # build is visible in this repository rather than buried in a tool's exit-code policy.
          semgrep scan --config p/java --sarif --output semgrep.sarif --quiet src

      - name: Fail on ERROR-severity findings
        # Done by hand rather than trusting the action's exit code, because the action's severity
        # threshold has changed between releases and a gate whose meaning drifts is not a gate.
        run: |
          if [ ! -s semgrep.sarif ]; then
            echo "::error::no SARIF at semgrep.sarif - the scan did not run"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("semgrep.sarif") as fh:
              sarif = json.load(fh)

          # Non-vacuity, before any counting. A scan that loaded no rules produces a well-formed
          # SARIF whose `results` is empty, and "zero findings" from a scanner that never ran is
          # indistinguishable from a clean bill of health unless something checks. That is the
          # failure this job actually had: `p/spring` 404'd, zero rules loaded, zero results, and
          # only Semgrep's exit code stood between that and a green tick on a security gate.
          # Two conditions mean "nothing was scanned", and both fail here:
          #
          # The same pass builds the rule-id -> severity map the gate below needs. It is not
          # bookkeeping: see the comment on `level` there for why `result.level` cannot be read.
          rules = 0
          errors = []
          rule_levels = {}
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              loaded = driver.get("rules", [])
              rules += len(loaded)
              for rule in loaded:
                  severity = (rule.get("defaultConfiguration") or {}).get("level") or "warning"
                  rule_levels[rule.get("id")] = severity
              for invocation in run.get("invocations", []):
                  for note in invocation.get("toolExecutionNotifications", []):
                      if note.get("descriptor", {}).get("id") == "SemgrepError":
                          errors.append(note.get("message", {}).get("text", "(no message)"))
          if errors:
              for message in errors:
                  print(f"  semgrep error: {message}")
          if rules == 0 or errors:
              print(f"::error::semgrep scanned nothing: {rules} rule(s) loaded, "
                    f"{len(errors)} tool error(s). A zero-finding result from a scan that did not "
                    f"run is not a clean result.")
              sys.exit(1)
          print(f"scanned with {rules} rule(s) loaded")

          blocking = []
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  # Severity is read from the RULE, not from the result. SARIF 2.1.0 says a result
                  # with no `level` inherits its rule's `defaultConfiguration.level`, and Semgrep
                  # writes severity *only* to the rule - a rule declared `severity: ERROR` produces
                  # results with no `level` field at all. This gate previously read `result.level`,
                  # so it saw no severity on any finding and could never block one: an ERROR-only
                  # gate that a 51-finding ERROR scan passed was the exact "check that cannot
                  # fail" this repository keeps calling worse than no check. The result's own
                  # `level` is still preferred when a scanner does set it.
                  level = (result.get("level")
                           or rule_levels.get(result.get("ruleId"), "warning")).upper()
                  if level in ("ERROR", "BLOCKER"):
                      blocking.append(result)
          print(f"{len(blocking)} ERROR-severity finding(s)")
          for result in blocking[:20]:
              where = result.get("locations", [{}])[0].get("physicalLocation", {})
              print(f"  {result.get('ruleId')} {where.get('artifactLocation', {}).get('uri')}"
                    f":{where.get('region', {}).get('startLine')}")
          sys.exit(1 if blocking else 0)
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    # Not gating on findings. A baseline scan reports everything it can find, including findings
    # that are correct for this system (a bearer-token API answers 401 to a scanner's
    # unauthenticated probe). Its job here is to produce evidence, not to stop a release over an
    # untriaged alert. The scan step below still fails on its own errors, so a red job here means
    # the scanner could not run - which is a defect in this workflow, not a finding in the code.
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and start the stack
        run: docker compose up -d --build app

      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q app)" 2>/dev/null || echo missing)
            if [ "$state" = "healthy" ]; then
              echo "healthy after $i checks"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the app never became healthy"
          docker compose logs --no-color app | tail -80
          exit 1

      # `--network=host` so the container can reach the compose-published port on localhost, which
      # is how `docker-compose.yml` publishes it.
      #
      # The report directory is created and opened up here, and that is not housekeeping. The image
      # runs as its own `zap` user (uid 1000) while the checked-out workspace belongs to the runner,
      # so without the `mkdir` Docker creates the bind source as root:root and every write into it
      # fails with `Permission denied: '/zap/wrk/zap.yaml'`. That was this job's actual failure on
      # every run: not a finding, but the scanner unable to write a report, exiting 2 while printing
      # `FAIL-NEW: 0`. A zero-finding scan that produces no artifact and a red X is worse than
      # either half on its own.
      #
      # Exit codes are the evidence policy, and they were read off the script rather than guessed
      # (an earlier draft of this comment had "2 or more means it did not complete", which is
      # wrong and would have failed the job on this application's normal outcome):
      #
      #   0  nothing found
      #   1  a FAIL alert was recorded
      #   2  a WARN alert was recorded
      #   3  nothing was scanned, or an exception was raised
      #
      # The first three all mean the scan ran and left evidence; alerts are what a baseline scan is
      # *for*, and nobody has triaged them yet, so none of them fails the job. This application
      # normally lands on 2 - its root answers 401 to an unauthenticated spider, which ZAP records
      # as a warning - so a policy that failed here would fail on every run. 3 is the case that
      # lacks evidence, and the report assertion below is the check that is not reachable through
      # the exit code alone: the job's actual failure was exit 2, `FAIL-NEW: 0`, and not one byte
      # written, because the scan could not write into a directory owned by the runner.
      - name: Baseline scan
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          status=0
          docker run --rm --network=host \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -J zap-report.json \
            || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::error::the ZAP baseline scan did not run (exit 3: nothing scanned, or an"
            echo "::error::exception) - there is no evidence behind this job"
            exit 1
          fi
          if [ "$status" -ge 4 ]; then
            echo "::error::the ZAP baseline scan returned an unexpected exit status $status"
            exit 1
          fi
          # Where the report lands is not where it looks like it lands. The image's WORKDIR is
          # `/zap`, and `zap-baseline.py` chdirs into `/zap/wrk` — the mount — once a file-based
          # option is given, so `-J zap-report.json` writes `zap-report/zap-report.json` on the
          # runner and not `./zap-report.json`. Every reader below has to agree with that, and the
          # previous version did not: it looked in the workspace root, which is the second reason
          # this job never uploaded a byte.
          test -s zap-report/zap-report.json || {
            echo "::error::no ZAP report at zap-report/zap-report.json - the scan exited $status"
            echo "::error::but wrote nothing, so this run has no evidence whatever the exit said"
            exit 1
          }
          echo "ZAP baseline completed: exit $status (0 clean, 1 FAIL alerts, 2 WARN alerts)"

      - name: Report
        if: always()
        run: |
          test -f zap-report/zap-report.html || { echo "::warning::no ZAP report produced"; exit 0; }
          python3 - <<'PY'
          import json, sys
          with open("zap-report/zap-report.json") as fh:
              report = json.load(fh)

          # ZAP's JSON document is {"site": [{"@name": ..., "alerts": [...]}]} - a *list* of sites,
          # each holding its own alerts. The previous version iterated the document as a
          # {site: report} mapping and called `.get` on the site key, which is a string: it would
          # have raised AttributeError the first time a report existed. It never did, so the bug
          # stayed invisible behind the guard above, which is the failure mode this whole job is
          # about - code that has never run being read as code that works.
          sites = report.get("site") or []
          if not isinstance(sites, list):
              sites = [sites]
          alerts = 0
          for site in sites:
              print(f"site {site.get('@name', '(unnamed)')}")
              for alert in site.get("alerts", []):
                  alerts += 1
                  print(f"  {alert.get('riskdesc')}: {alert.get('alert')}")
          print(f"zap recorded {alerts} alert(s) over {len(sites)} site(s)")
          if not sites:
              print("::error::the ZAP report names no sites - the scan produced a document but "
                    "scanned nothing, which is not a clean result")
              sys.exit(1)
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zap-report
          path: |
            zap-report/zap-report.html
            zap-report/zap-report.json
          # `error`, not `ignore`. The whole reason this job exists is the evidence, and a run that
          # uploads nothing while showing a green tick is the failure mode it was written against.
          if-no-files-found: error
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v