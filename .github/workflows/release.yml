name: release

# A tag may only point at a tree that passes. This workflow re-runs the full gate against exactly
# the tagged commit, so the tag and the evidence cannot drift apart.
#
# What it deliberately does NOT do: publish an image to a registry, create a GitHub release, or
# push anything. An artifact that outlives this repository is a human decision, and RELEASE.md
# documents the manual step. A workflow that published on a tag would put an unverified artifact
# somewhere permanent the first time it ran with credentials it had no business having.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: mvn verify
        run: mvn -B verify

      - name: both suites ran
        run: python scripts/check_suites.py

      # The image is built here, not just the jar, because the jar is not the artifact: a Docker
      # build that fails on the tagged tree means the tag cannot ship even if the tests passed.
      - name: build the image
        run: docker build -t reconcile:${{ github.ref_name }} .

      - name: start the image and run the smoke test
        run: |
          docker compose up -d app
          # Same health-wait shape the verify workflow uses, so a slow start is a timeout rather
          # than a failed assertion in the probe.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 60 ]; then echo "::error::app did not become healthy"; exit 1; fi
            sleep 2
          done
          bash scripts/probe.sh

      - name: logs on failure
        if: failure()
        run: docker compose logs app

      - name: tear down
        if: always()
        run: docker compose down -v
