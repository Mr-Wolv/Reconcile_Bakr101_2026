    post:
      tags:
      - reconciliation-controller
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BatchView"
  /api/v1/provider/webhooks:
    post:
      tags:
      - provider-webhook-controller
      operationId: receive
      parameters:
      - name: X-Provider-Event-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Provider-Timestamp
        in: header
        required: false
        schema:
          type: string
      - name: X-Provider-Signature
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/provider/sync:
    post:
      tags:
      - provider-simulator-controller
      operationId: sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
        required: true
      responses:
        "200":
