openapi: 3.1.0
info:
  title: Reconcile - payment & settlement reconciliation
  description: |
    Money movement, provider settlement ingestion, and reconciliation.

    Every mutating endpoint requires an `Idempotency-Key` and replays a
    stored response for 24 hours. Refusals are RFC 9457 problem
    documents; the failure taxonomy is in `docs/spec/07-failure-matrix.md`
    and the error table in `docs/spec/06-api-contract.md`.

    Two routes are deliberately unauthenticated: `GET /api/v1/health`,
    which a load balancer must be able to reach, and
    `POST /api/v1/provider/webhooks`, which authenticates by HMAC
    signature rather than by token.
  license:
    name: Proprietary
  version: v1
servers:
- url: /
  description: This application
security:
- bearerAuth: []
paths:
  /api/v1/reconciliation/cases/{id}/write-off:
    post:
      tags:
      - reconciliation-controller
      operationId: writeOff
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/reconciliation/cases/{id}/resolve:
    post:
      tags:
      - reconciliation-controller
      operationId: resolve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/reconciliation/cases/{id}/investigate:
    post:
      tags:
      - reconciliation-controller
      operationId: investigate
      parameters:
      - name: id
        in: path
        required: true
        schema:
