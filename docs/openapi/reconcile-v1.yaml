          type: string
          format: date-time
      - name: windowEnd
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items: {}
  /api/v1/provider/events:
    get:
      tags:
      - provider-simulator-controller
      operationId: events
      parameters:
      - name: providerTransactionId
        in: query
        required: false
        schema:
