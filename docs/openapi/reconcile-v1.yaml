          content:
            '*/*':
              schema:
                type: string
  /api/v1/ledger/transactions/{id}/reverse:
    post:
      tags:
      - ledger-controller
      operationId: reverse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/reconciliation/cases:
    get:
      tags:
      - reconciliation-controller
      operationId: openCases
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseView"
  /api/v1/reconciliation/batches/{id}:
    get:
      tags:
      - reconciliation-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
