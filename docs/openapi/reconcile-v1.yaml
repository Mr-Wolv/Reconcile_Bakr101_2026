  /api/v1/metrics/summary:
    get:
      tags:
      - operations-controller
      operationId: summary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/ledger/transactions/{id}:
    get:
      tags:
      - ledger-controller
      operationId: transaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LedgerTransactionView"
  /api/v1/health:
    get:
      tags:
      - operations-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Report"
  /api/v1/audit/events:
    get:
      tags:
      - operations-controller
      operationId: auditEvents
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
      - name: actorType
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: requestId
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: afterId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEventView"
  /api/v1/audit/entities/{type}/{id}:
    get:
      tags:
      - operations-controller
      summary: "Audit trail for a single entity, by entity type and id"
      operationId: entityTrail
      parameters:
      - name: type
        in: path
        description: "Entity type token. Case-insensitive: `payment` and `PAYMENT`\
          \ are the same request. Any other value is a 404. Accepted: PAYMENT, PAYOUT_RECORD,\
          \ PROVIDER, PROVIDER_EVENT, SETTLEMENT_RECORD, RECONCILIATION_BATCH, RECONCILIATION_RESULT,\
          \ RECONCILIATION_CASE, IDEMPOTENCY_RECORD."
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: "The entity's id, as stored in `audit_events.entity_id`"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEventView"
  /api/v1/accounts:
    get:
      tags:
      - ledger-controller
      operationId: accounts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
  /api/v1/accounts/{code}:
    get:
      tags:
      - ledger-controller
      operationId: account
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: EGP
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountBalance"
  /api/v1/accounts/{code}/entries:
    get:
      tags:
      - ledger-controller
      operationId: entries
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntriesPage"
components:
  schemas:
    WriteOffRequest:
      type: object
      properties:
        resolutionNote:
          type: string
          maxLength: 2000
          minLength: 20
        resolutionAction:
          type: string
          enum:
          - PROVIDER_ERROR_CONFIRMED
          - INTERNAL_ERROR_CONFIRMED
          - DUPLICATE_OF_CASE
          - TIMING_DIFFERENCE
          - OTHER
      required:
      - resolutionAction
      - resolutionNote
    ResolveRequest:
      type: object
      properties:
        resolutionNote:
          type: string
          maxLength: 2000
          minLength: 20
        adjustmentLedgerTransactionId:
          type: string
      required:
      - resolutionNote
    InvestigateRequest:
      type: object
      properties:
        assignedTo:
          type: string
          minLength: 1
      required:
      - assignedTo
    CaseView:
      type: object
      properties:
        id:
          type: string
        caseNumber:
          type: string
        paymentId:
          type: string
        providerTransactionId:
          type: string
        reason:
          type: string
        severity:
          type: string
        status:
          type: string
        occurrenceCount:
          type: integer
          format: int32
        detectedAt:
          type: string
          format: date-time
    CreateBatchRequest:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        subjectMode:
          type: string
          enum:
          - INTERNAL_LEDGER
          - PROVIDER_ONLY
          - BOTH
        async:
          type: boolean
      required:
      - provider
      - windowEnd
      - windowStart
    BatchView:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        subjectMode:
          type: string
        status:
          type: string
        totalSubjects:
          type: integer
          format: int32
        processedSubjects:
          type: integer
          format: int32
        totals:
          $ref: "#/components/schemas/Summary"
    Summary:
      type: object
      properties:
        matched:
          type: integer
          format: int32
        matchedNotSettled:
          type: integer
          format: int32
        mismatched:
          type: integer
          format: int32
        missingOnProvider:
          type: integer
          format: int32
        missingInternal:
          type: integer
          format: int32
        duplicates:
          type: integer
          format: int32
        ambiguous:
          type: integer
          format: int32
        grossDeltaMinor:
          type: integer
          format: int64
        casesOpened:
          type: integer
          format: int32
        casesReused:
          type: integer
          format: int32
    SyncRequest:
      type: object
      properties:
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
      required:
      - windowEnd
      - windowStart
    SyncResult:
      type: object
      properties:
        fetched:
          type: integer
          format: int32
        ingested:
          type: integer
          format: int32
        alreadyKnown:
          type: integer
          format: int32
        errors:
          type: array
          items:
            type: string
    RegisterPaymentRequest:
      type: object
      properties:
        merchantReference:
          type: string
          minLength: 1
        grossAmountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 1
        behaviour:
          type: array
          items:
            type: string
      required:
      - currency
      - grossAmountMinor
      - merchantReference
    RegisteredPayment:
      type: object
      properties:
        externalTransactionId:
          type: string
        merchantReference:
          type: string
        grossAmountMinor:
          type: integer
          format: int64
        currency:
          type: string
        behaviours:
          type: array
          items:
            type: string
    ExecutePayoutRequest:
      type: object
      properties:
        merchantReference:
          type: string
          minLength: 1
        paymentIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - merchantReference
      - paymentIds
    CreatePaymentRequest:
      type: object
      properties:
        merchantReference:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        description:
          type: string
          maxLength: 280
          minLength: 0
        amount:
          $ref: "#/components/schemas/MoneyDto"
        provider:
          type: string
        providerTransactionId:
          type: string
      required:
      - amount
      - merchantReference
    MoneyDto:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    FailRequest:
      type: object
      properties:
        failureCode:
          type: string
          maxLength: 32
          minLength: 0
        reason:
          type: string
          maxLength: 280
          minLength: 0
      required:
      - failureCode
    CaptureRequest:
      type: object
      properties:
        expectedAmount:
          $ref: "#/components/schemas/MoneyDto"
    ReverseRequest:
      type: object
      properties:
        reason:
          type: string
    ResultView:
      type: object
      properties:
        subjectKey:
          type: string
        outcome:
          type: string
        internalPaymentId:
          type: string
        providerTransactionId:
          type: string
        deltaMinor:
          type: integer
          format: int64
        caseId:
          type: string
        differences:
          type: string
    QueuedEvent:
      type: object
      properties:
        eventId:
          type: string
        type:
          type: string
        body:
          type: string
        occurredAt:
          type: string
          format: date-time
        timestampOffsetSeconds:
          type: integer
          format: int32
        signTimestamp:
          type: string
        signature:
          type: string
    FailedEvent:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
        attempts:
          type: integer
          format: int32
        lastError:
          type: string
        status:
          type: string
    FailedEventPage:
      type: object
      properties:
        count:
          type: integer
          format: int32
        events:
          type: array
          items:
            $ref: "#/components/schemas/FailedEvent"
    PayoutLineResponse:
      type: object
      properties:
        paymentId:
          type: string
        netAmount:
          $ref: "#/components/schemas/MoneyDto"
        lineNo:
          type: integer
          format: int32
    PayoutResponse:
      type: object
      properties:
        id:
          type: string
        merchantReference:
          type: string
        totalNet:
          $ref: "#/components/schemas/MoneyDto"
        lineCount:
          type: integer
          format: int32
        status:
          type: string
        ledgerTransactionId:
          type: string
        executedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayoutLineResponse"
    PageResponsePaymentResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentResponse"
        nextCursor:
          type: string
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
        merchantReference:
          type: string
        description:
          type: string
        amount:
          $ref: "#/components/schemas/MoneyDto"
        platformFee:
          $ref: "#/components/schemas/MoneyDto"
        netAmount:
          $ref: "#/components/schemas/MoneyDto"
        state:
          type: string
        failureCode:
          type: string
        failureReason:
          type: string
        provider:
          type: string
        providerTransactionId:
          type: string
        capturedAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
        paidOutAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
