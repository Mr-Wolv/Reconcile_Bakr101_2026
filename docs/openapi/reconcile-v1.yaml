      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisteredPayment"
  /api/v1/payouts:
    post:
      tags:
      - payout-controller
      operationId: execute
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
