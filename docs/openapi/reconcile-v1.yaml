  /api/v1/payments:
    get:
      tags:
      - payment-controller
      operationId: list_1
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: merchantReference
        in: query
        required: false
        schema:
          type: string
      - name: providerTransactionId
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePaymentResponse"
    post:
      tags:
      - payment-controller
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/payments/{id}/refund:
